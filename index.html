---
layout: default
---
<div class="home">
  <div class="home-intro">
    <p>{{ site.description }}</p>
    <p>A place for longer thoughts on things I find interesting. You can <a href="{{ '/about/' | relative_url }}">read more about me</a> or subscribe via <a href="{{ '/feed.xml' | relative_url }}">RSS</a>.</p>
  </div>
  <h2 class="post-list-heading">Writing</h2>
  <ul class="post-list">
    {% for post in site.posts %}
    <li>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %-d, %Y" }}</time>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
    {% endfor %}
  </ul>
</div>
